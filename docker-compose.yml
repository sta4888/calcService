
services:
  api:
    build: .
    container_name: calcservice
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq
    volumes:
      - .:/app
    networks:
      - calc_net

  db:
    image: postgres:16
    container_name: calcservice_db
    restart: always
    env_file:
      - .env
    ports:
      - ":5432"
    volumes:
      - calc_pgdata:/var/lib/postgresql/data
    networks:
      - calc_net

  pg:
    image: dpage/pgadmin4
    container_name: pg_adm
    restart: always
    ports:
      - "8888:80"
    env_file:
      - .env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - calc_net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: calcservice_rabbitmq
    restart: always
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # UI
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - calc_net

volumes:
  calc_pgdata:
  rabbitmq_data:
  pgadmin_data:

networks:
  calc_net:
    driver: bridge
